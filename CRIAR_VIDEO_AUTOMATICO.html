<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>GERADOR DE VÍDEO DE DIVULGAÇÃO // TV CÓDIGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020403;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid #00ff66;
      box-shadow: 0 0 50px rgba(0, 255, 102, 0.4);
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls-bar {
      margin-top: 20px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      background: linear-gradient(135deg, #00ff66 0%, #00cc55 100%);
      color: #000;
      border: none;
      padding: 14px 28px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 900;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.5);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(0, 255, 102, 0.8);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .status-text {
      color: #00ff66;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div style="margin-bottom: 16px; text-align: center;">
    <h1 style="font-family: 'Outfit', sans-serif; font-size: 26px; color: #00ff66; text-shadow: 0 0 15px rgba(0,255,102,0.6);">
      🎬 GERADOR DE VÍDEO DO SITE EM ALTA RESOLUÇÃO
    </h1>
    <p style="font-size: 12px; color: #aaa; margin-top: 4px;">
      O vídeo abaixo roda automaticamente todas as funções do seu site (Login, Netflix, HBO Max e Cookies).
    </p>
  </div>

  <div class="video-wrapper">
    <canvas id="videoCanvas" width="1280" height="720"></canvas>
  </div>

  <div class="controls-bar">
    <button class="btn" id="btnRecord" onclick="startRecordingVideo()">
      🎥 BAIXAR ESTE VÍDEO (.WEBM / .MP4)
    </button>
    <button class="btn btn-secondary" onclick="restartAnimation()">
      🔄 REINICIAR PRÉVIA
    </button>
    <span class="status-text" id="statusMsg">● Pronto para Gravar</span>
  </div>

  <script>
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1280, H = 720;
    let startTime = Date.now();
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    // Matrix particles
    const fontSize = 16;
    const columns = Math.floor(W / fontSize);
    const drops = [];
    const chars = '0123456789ABCDEFNETFLIXHBOMAXCONNECTPAIRSTREAM'.split('');
    for (let i = 0; i < columns; i++) drops[i] = Math.floor(Math.random() * -50);

    function draw() {
      const elapsed = (Date.now() - startTime) / 1000;
      const loopDuration = 12.0; // 12 seconds loop
      const t = elapsed % loopDuration;

      // Determine scene
      const isLogin = (t < 3.8);
      const isNetflix = (3.8 <= t && t < 8.0);
      const isHBO = (8.0 <= t && t < 10.0);
      const isCookie = (t >= 10.0);

      // Matrix rain color
      let mColor = '#00ff66';
      if (isCookie) mColor = '#e50914';
      else if (isHBO) mColor = '#a855f7';
      else if (isNetflix) mColor = '#e50914';

      // Trail fade on pure black
      ctx.fillStyle = 'rgba(2, 4, 3, 0.16)';
      ctx.fillRect(0, 0, W, H);

      // Matrix Rain
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        const y = drops[i] * fontSize;

        if (Math.random() > 0.88) ctx.fillStyle = '#ffffff';
        else ctx.fillStyle = mColor;

        ctx.fillText(text, i * fontSize, y);

        if (y > H && Math.random() > 0.97) drops[i] = 0;
        drops[i]++;
      }

      // SCENE 1: ROOT_SECURITY LOGIN
      if (isLogin) {
        const cx = W / 2, cy = H / 2;
        const cardW = 420, cardH = 370;
        const x0 = cx - cardW / 2, y0 = cy - cardH / 2;

        // Card
        ctx.fillStyle = 'rgba(6, 16, 9, 0.94)';
        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 2;
        roundRect(ctx, x0, y0, cardW, cardH, 26, true, true);

        // Circle Badge
        ctx.fillStyle = 'rgba(0, 255, 102, 0.08)';
        ctx.beginPath();
        ctx.arc(cx, y0 + 55, 34, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.font = '28px sans-serif';
        ctx.fillStyle = '#00ff66';
        ctx.fillText('🔒', cx - 14, y0 + 64);

        // Titles
        ctx.font = '900 24px "JetBrains Mono"';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText('ROOT_SECURITY', cx, y0 + 120);

        ctx.font = '700 11px "JetBrains Mono"';
        ctx.fillStyle = '#00ff66';
        ctx.fillText('// ACESSO RESTRITO • PROTOCOLO CRIPTOGRÁFICO', cx, y0 + 142);

        // Input
        const inpY = y0 + 175;
        ctx.fillStyle = '#000000';
        ctx.strokeStyle = '#00ff66';
        ctx.lineWidth = 1.5;
        roundRect(ctx, x0 + 30, inpY, cardW - 60, 46, 23, true, true);

        ctx.textAlign = 'left';
        ctx.font = '13px "JetBrains Mono"';
        ctx.fillStyle = '#00ff66';
        ctx.fillText('🔒', x0 + 44, inpY + 28);

        // Typing pwd
        const fullPwd = 'CYBER#ROOT@9821$MATRIX*SECURE!2026';
        if (t < 1.0) {
          ctx.fillStyle = 'rgba(0, 255, 102, 0.6)';
          ctx.fillText('DIGITE A SENHA MESTRE...', x0 + 72, inpY + 28);
        } else {
          const charsTyped = Math.min(Math.floor((t - 1.0) * 15), fullPwd.length);
          const dots = '•'.repeat(charsTyped);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(dots + ((Math.floor(t * 4) % 2 === 0) ? '|' : ''), x0 + 72, inpY + 28);
        }

        ctx.fillStyle = '#00ff66';
        ctx.fillText('👁️', x0 + cardW - 65, inpY + 28);

        // Checkbox
        ctx.font = '600 11px "JetBrains Mono"';
        ctx.fillStyle = '#a3e635';
        ctx.fillText('✔ Lembrar neste dispositivo (Acesso rápido)', x0 + 35, inpY + 70);

        // Button
        const btnY = inpY + 95;
        ctx.fillStyle = (t > 3.2) ? '#ffffff' : '#00ff66';
        roundRect(ctx, x0 + 30, btnY, cardW - 60, 48, 24, true, false);

        ctx.font = '900 14px "JetBrains Mono"';
        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.fillText('DESBLOQUEAR TERMINAL 🔓', cx, btnY + 29);
      }
      else {
        // SCENE 2: DASHBOARD
        const cx = W / 2;
        const curTheme = isHBO ? '#a855f7' : '#e50914';

        // Telemetry
        ctx.fillStyle = 'rgba(15, 8, 12, 0.9)';
        ctx.strokeStyle = curTheme;
        ctx.lineWidth = 1;
        roundRect(ctx, cx - 290, 30, 580, 42, 21, true, true);

        ctx.fillStyle = '#00ff66';
        ctx.beginPath();
        ctx.arc(cx - 265, 51, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = '700 12px "JetBrains Mono"';
        ctx.fillStyle = curTheme;
        ctx.textAlign = 'left';
        ctx.fillText('ONLINE', cx - 250, 55);

        ctx.fillStyle = '#aaa';
        ctx.fillText('PING: 18ms', cx - 170, 55);

        // Buttons
        roundRect(ctx, cx + 50, 36, 95, 30, 15, false, true);
        ctx.fillStyle = '#ffd700';
        ctx.fillText('🍪 COOKIES', cx + 58, 55);

        roundRect(ctx, cx + 155, 36, 115, 30, 15, false, true);
        ctx.fillStyle = '#fff';
        ctx.fillText('🔒 BLOQUEAR', cx + 165, 55);

        // Switcher Tabs
        const tabY = 88;
        if (isHBO) {
          roundRect(ctx, cx - 290, tabY, 280, 42, 20, true, false);
          ctx.fillStyle = '#666';
          ctx.textAlign = 'center';
          ctx.fillText('🔴 NETFLIX', cx - 150, tabY + 26);

          ctx.fillStyle = 'rgba(168, 85, 247, 0.4)';
          ctx.strokeStyle = '#a855f7';
          roundRect(ctx, cx + 10, tabY, 280, 42, 20, true, true);
          ctx.fillStyle = '#fff';
          ctx.fillText('🟣 HBO MAX', cx + 150, tabY + 26);
        } else {
          ctx.fillStyle = 'rgba(229, 9, 20, 0.4)';
          ctx.strokeStyle = '#e50914';
          roundRect(ctx, cx - 290, tabY, 280, 42, 20, true, true);
          ctx.fillStyle = '#fff';
          ctx.textAlign = 'center';
          ctx.fillText('🔴 NETFLIX', cx - 150, tabY + 26);

          roundRect(ctx, cx + 10, tabY, 280, 42, 20, true, false);
          ctx.fillStyle = '#666';
          ctx.fillText('🟣 HBO MAX', cx + 150, tabY + 26);
        }

        // Active Account & Smart TV Card
        const cardY = 145;
        ctx.fillStyle = isHBO ? 'rgba(20, 8, 30, 0.88)' : 'rgba(20, 8, 11, 0.88)';
        ctx.strokeStyle = curTheme;
        ctx.lineWidth = 1.8;
        roundRect(ctx, cx - 290, cardY, 580, 540, 24, true, true);

        // Card Title
        ctx.textAlign = 'left';
        ctx.font = '800 13px "JetBrains Mono"';
        ctx.fillStyle = curTheme;
        ctx.fillText(`🔴 CONTA ${isHBO ? 'HBO MAX' : 'NETFLIX'} PRONTA PARA ATIVAÇÃO`, cx - 265, cardY + 28);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#00ff66';
        ctx.fillText('● SINAL ONLINE', cx + 265, cardY + 28);

        // Account Boxes
        ctx.fillStyle = '#000000';
        ctx.strokeStyle = curTheme;
        roundRect(ctx, cx - 265, cardY + 45, 255, 60, 14, true, true);
        ctx.textAlign = 'left';
        ctx.font = '700 9px "JetBrains Mono"';
        ctx.fillStyle = '#888';
        ctx.fillText('// CONTA CONECTADA', cx - 250, cardY + 62);
        ctx.font = '700 12px "JetBrains Mono"';
        ctx.fillStyle = '#fff';
        ctx.fillText('[BR] brayanmello@gmail.com', cx - 250, cardY + 85);

        roundRect(ctx, cx + 10, cardY + 45, 255, 60, 14, true, true);
        ctx.font = '700 9px "JetBrains Mono"';
        ctx.fillStyle = '#888';
        ctx.fillText('// PLANO DA CONTA', cx + 25, cardY + 62);
        ctx.font = '700 12px "JetBrains Mono"';
        ctx.fillStyle = '#ffd700';
        ctx.fillText('⚡ Premium 4K UHD VIP', cx + 25, cardY + 85);

        // Smart TV Pin Slots
        const pinY = cardY + 130;
        ctx.font = '800 13px "JetBrains Mono"';
        ctx.fillStyle = '#fff';
        ctx.fillText(`📺 SMART TV // ${isHBO ? 'HBO MAX' : 'NETFLIX'} PAIRING`, cx - 265, pinY + 15);

        const sampleCode = isHBO ? 'MAX821' : '98451270';
        const typedCount = Math.max(0, Math.min(Math.floor((t - 4.2) * 3), sampleCode.length));

        const startX = cx - 240;
        for (let s = 0; s < 8; s++) {
          const sx = startX + s * 60;
          const sy = pinY + 35;
          const hasChar = (s < typedCount);

          ctx.fillStyle = hasChar ? (isHBO ? 'rgba(168,85,247,0.3)' : 'rgba(229,9,20,0.3)') : '#000000';
          ctx.strokeStyle = hasChar ? curTheme : '#444';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(sx + 24, sy + 24, 24, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          if (hasChar) {
            ctx.textAlign = 'center';
            ctx.font = '900 20px "JetBrains Mono"';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(sampleCode[s], sx + 24, sy + 31);
          }
        }

        // Action Button
        const btnTxY = pinY + 100;
        ctx.fillStyle = isHBO ? 'linear-gradient(135deg, #a855f7 0%, #7e22ce 100%)' : '#e50914';
        roundRect(ctx, cx - 265, btnTxY, 530, 52, 26, true, false);

        ctx.textAlign = 'center';
        ctx.font = '900 15px "JetBrains Mono"';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('EXECUTAR INJEÇÃO DE TOKEN ⚡', cx, btnTxY + 32);

        // Queue list
        ctx.textAlign = 'left';
        ctx.font = '700 11px "JetBrains Mono"';
        ctx.fillStyle = '#888';
        ctx.fillText('🍪 PRÓXIMOS COOKIES DISPONÍVEIS NA FILA:', cx - 265, btnTxY + 75);

        for (let q = 0; q < 3; q++) {
          const qy = btnTxY + 90 + q * 38;
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.strokeStyle = '#333';
          roundRect(ctx, cx - 265, qy, 530, 32, 10, true, true);

          ctx.font = '11px "JetBrains Mono"';
          ctx.fillStyle = '#fff';
          ctx.fillText(`● [BR] conta_vip_0${q+1}@streaming.com - Premium`, cx - 250, qy + 20);

          ctx.fillStyle = '#00ff66';
          ctx.textAlign = 'right';
          ctx.fillText('⚡ 100% ATIVO', cx + 250, qy + 20);
          ctx.textAlign = 'left';
        }

        // SCENE 3: RED COOKIE SECURITY MODAL OVERLAY
        if (isCookie) {
          ctx.fillStyle = 'rgba(0,0,0,0.85)';
          ctx.fillRect(0, 0, W, H);

          const cardW = 420, cardH = 370;
          const x0 = cx - cardW / 2, y0 = H / 2 - cardH / 2;

          ctx.fillStyle = 'rgba(20, 6, 8, 0.95)';
          ctx.strokeStyle = '#e50914';
          ctx.lineWidth = 2;
          roundRect(ctx, x0, y0, cardW, cardH, 26, true, true);

          ctx.fillStyle = 'rgba(229, 9, 20, 0.1)';
          ctx.beginPath();
          ctx.arc(cx, y0 + 55, 34, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.font = '28px sans-serif';
          ctx.fillStyle = '#e50914';
          ctx.fillText('🔒', cx - 14, y0 + 64);

          ctx.font = '900 24px "JetBrains Mono"';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.fillText('COOKIE_SECURITY', cx, y0 + 120);

          ctx.font = '700 11px "JetBrains Mono"';
          ctx.fillStyle = '#e50914';
          ctx.fillText('// COFRE DE COOKIES • PROTOCOLO CRIPTOGRÁFICO', cx, y0 + 142);

          const inpY = y0 + 175;
          ctx.fillStyle = '#000000';
          ctx.strokeStyle = '#e50914';
          roundRect(ctx, x0 + 30, inpY, cardW - 60, 46, 23, true, true);

          ctx.textAlign = 'left';
          ctx.font = '13px "JetBrains Mono"';
          ctx.fillStyle = '#e50914';
          ctx.fillText('🔒', x0 + 44, inpY + 28);
          ctx.fillStyle = '#fff';
          ctx.fillText('••••••••••••••••••••••', x0 + 72, inpY + 28);
          ctx.fillText('👁️', x0 + cardW - 65, inpY + 28);

          const btnY = inpY + 70;
          ctx.fillStyle = '#e50914';
          roundRect(ctx, x0 + 30, btnY, cardW - 60, 48, 24, true, false);

          ctx.font = '900 14px "JetBrains Mono"';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.fillText('DESBLOQUEAR COFRE 🔓', cx, btnY + 29);
        }
      }

      requestAnimationFrame(draw);
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function restartAnimation() {
      startTime = Date.now();
    }

    function startRecordingVideo() {
      const btn = document.getElementById('btnRecord');
      const status = document.getElementById('statusMsg');
      
      if (isRecording) return;
      isRecording = true;
      startTime = Date.now();
      recordedChunks = [];

      status.innerText = '🔴 Gravando vídeo (12 segundos)...';
      btn.innerText = '⏳ GRAVANDO...';
      btn.disabled = true;

      const stream = canvas.captureStream(60);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'VIDEO_DIVULGACAO_TVCODIGO.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        status.innerText = '✅ VÍDEO BAIXADO COM SUCESSO!';
        btn.innerText = '🎥 BAIXAR NOVAMENTE';
        btn.disabled = false;
        isRecording = false;
      };

      mediaRecorder.start();
      setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
      }, 12000);
    }

    // Start rendering loop
    draw();
  </script>
</body>
</html>
